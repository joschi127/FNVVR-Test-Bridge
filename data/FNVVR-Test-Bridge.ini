[Bridge]
; 1 lets test tools on this PC, for this Windows user only, run console lines in the game through a named pipe.
; 0 (the default): the plugin does nothing at all. Idle with 1 it costs no measurable frame time; use 0 when
; measuring the performance of other changes.
Enabled=0
; Pipe \.\pipe\<PipeName>. A second game on the same PC gets "<PipeName>-<process id>" (see the log).
PipeName=FNVVR-Test-Bridge
